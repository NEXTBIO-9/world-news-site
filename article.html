<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>기사 | NEXT BIO</title>
<style>body{margin:0;background:#101827;color:#edf4ff;font:16px/1.8 system-ui,-apple-system,sans-serif}main{max-width:800px;margin:0 auto;padding:32px 20px 80px}header{border-bottom:1px solid #34445d;padding:18px 20px}a{color:#a6d0ff}h1{font-size:clamp(26px,5vw,38px);line-height:1.4}#meta{color:#aebdd2;font-size:14px}#body{overflow-wrap:anywhere;font-size:17px;line-height:1.95;margin-top:32px;color:#dbe5f3}#body p{margin:0 0 1.45em}#body h2{font-size:clamp(21px,3vw,26px);line-height:1.5;letter-spacing:-.025em;color:#f7faff;margin:2.3em 0 .9em;padding-bottom:13px;border-bottom:1px solid #304159}#body h3{font-size:20px;margin:1.8em 0 .7em}#body strong{color:#fff;font-weight:700}#body ul{padding-left:1.5em;margin:0 0 1.6em}#body li{margin:.5em 0}#body .article-lead{font-size:19px;line-height:1.75;color:#b8c9e0;margin-bottom:2em}#body blockquote{margin:1.8em 0;padding:12px 20px;border-left:3px solid #68b8ff;background:#18263b;border-radius:0 8px 8px 0}#body blockquote p{margin:0}#body .article-original-title{font-size:clamp(23px,4vw,31px);line-height:1.45;letter-spacing:-.035em;margin:0 0 20px;color:#fff}#body .article-subtitle{color:#a9bed8;font-size:16px;line-height:1.75;margin-bottom:32px}#body hr{border:0;border-top:1px solid #34445d;margin:36px 0}#body.article-3-2{margin-top:20px}#body.article-3-2 p{margin-bottom:1em}#body.article-3-2 .article-subtitle{font-size:16px;font-weight:400;line-height:1.7;color:#a9bed8;margin:0 0 22px;padding-bottom:18px;border-bottom:1px solid #304159}#body.article-3-2 .article-subtitle strong{font-weight:400;color:inherit}#body.article-3-2 .article-lead{font-size:17px;line-height:1.85;color:#dbe5f3;margin-bottom:1em}main{max-width:760px;padding-top:44px}#title{letter-spacing:-.04em;line-height:1.35;margin:8px 0 14px}#meta{border-bottom:1px solid #34445d;padding-bottom:22px}#cover{max-width:100%;border-radius:12px;margin-top:22px;display:none}.tag{color:#86baff;font-weight:700}#error{color:#ffb8b8}</style></head>
<body><header><a href="./">NEXT BIO · 세계뉴스</a></header><main><p class="tag" id="category">직접 작성 뉴스</p><h1 id="title">기사 불러오는 중...</h1><div id="meta"></div><img id="cover" alt="기사 대표 이미지" referrerpolicy="no-referrer"><article id="body"></article><p id="error" role="alert"></p><p style="margin-top:48px"><a href="./">← 뉴스 목록으로 돌아가기</a></p></main>
<script>
function renderArticle(container,source){
 container.replaceChildren();
 const lines=String(source).replace(/\r\n?/g,'\n').split('\n');
 let list=null,paragraph=[],firstParagraph=true;
 function inline(parent,value){
  const parts=String(value).split(/(\*\*[^*]+\*\*)/g);
  for(const part of parts){
   if(!part)continue;
   if(part.startsWith('**')&&part.endsWith('**')){const strong=document.createElement('strong');strong.textContent=part.slice(2,-2);parent.append(strong)}
   else parent.append(document.createTextNode(part));
  }
 }
 function flush(){
  if(!paragraph.length)return;
  const p=document.createElement('p');inline(p,paragraph.join(' '));
  if(firstParagraph){p.classList.add('article-lead');firstParagraph=false}
  container.append(p);paragraph=[];
 }
 for(const raw of lines){
  const line=raw.trim();
  if(!line){flush();list=null;continue}
  const heading=line.match(/^(#{1,3})\s+(.+)$/);
  if(heading){
   flush();list=null;
   const h=document.createElement(heading[1].length===1?'h2':heading[1].length===2?'h2':'h3');
   if(heading[1].length===1)h.className='article-original-title';
   inline(h,heading[2]);container.append(h);continue;
  }
  if(/^---+$/.test(line)){flush();list=null;container.append(document.createElement('hr'));continue}
  if(line.startsWith('- ')){
   flush();if(!list){list=document.createElement('ul');container.append(list)}
   const li=document.createElement('li');inline(li,line.slice(2));list.append(li);continue;
  }
  list=null;
  if(/^\*\*.+\*\*$/.test(line)&&!paragraph.length&&(container.children.length===0||(container.children.length===1&&container.firstElementChild?.classList.contains('article-original-title')))){
   const p=document.createElement('p');p.className='article-subtitle';inline(p,line);container.append(p);continue;
  }
  paragraph.push(line);
 }
 flush();
}
(async function(){
 const id=Number(new URLSearchParams(location.search).get('id'));
 const error=document.getElementById('error');
 if(!Number.isSafeInteger(id)||id<1){document.getElementById('title').textContent='기사 번호가 올바르지 않습니다.';return;}
 try{
  // Pages deployment may lag behind the latest GitHub Actions commit.
  // Prefer the newest public main-branch data, then use Pages as fallback.
  const sources=[
    'https://raw.githubusercontent.com/NEXTBIO-9/world-news-site/main/data/manual-articles.json?t='+Date.now(),
    './data/manual-articles.json?t='+Date.now()
  ];
  let a=null;
  for(const source of sources){
    try{
      const r=await fetch(source,{cache:'no-store'});
      if(!r.ok)continue;
      const data=await r.json();
      a=(Array.isArray(data.articles)?data.articles:[]).find(x=>Number(x.manual_issue)===id);
      if(a)break;
    }catch(fetchError){console.warn('Article source unavailable',fetchError);}
  }
  if(!a){document.getElementById('title').textContent='아직 기사를 불러오지 못했습니다.';error.textContent='발행 처리 중일 수 있습니다. 15초 후 자동으로 다시 확인합니다.';setTimeout(()=>location.reload(),15000);return;}
  // Article #19: protect against stale CDN copies of the pre-edit article.
  if(id===19){
    a={...a,title:'3-2번 기사'};
    let body=String(a.body||a.summary||'');
    body=body.replace(/(?:^|\\n)## ■ 북한이 실제로 공격했다면 무슨 일이 벌어졌을까[\\s\\S]*?(?=\\n## ■ 2024년 계엄 이전의 군사작전은 무엇을 남겼나|$)/,'');
    body=body.replace(/(?:^|\\n)## ■ 2017년 기무사 계엄 문건과 연결되는 질문[\\s\\S]*?(?=\\n## ■ 2024년 계엄 이전의 군사작전은 무엇을 남겼나|$)/,'');
    a.body=body.trim();
  }
  if(id===19)document.getElementById('body').classList.add('article-3-2');
  document.title=a.title+' | NEXT BIO';
  document.getElementById('title').textContent=a.title||'제목 없음';
  document.getElementById('category').style.display='none';
  renderArticle(document.getElementById('body'),a.body||a.summary||'');

  document.getElementById('meta').style.display='none';
  if(typeof a.image==='string'&&/^https:\/\//i.test(a.image)){const img=document.getElementById('cover');img.src=a.image;img.style.display='block';img.onerror=()=>{img.style.display='none';};}
 }catch(e){document.getElementById('title').textContent='기사를 불러올 수 없습니다.';error.textContent='잠시 후 다시 시도해 주세요.';console.error(e);}
})();
</script></body></html>
