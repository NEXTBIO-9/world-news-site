<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXT BIO | 24시간 브리핑</title><style>body{margin:0;font:16px system-ui,sans-serif;background:#f4f7fb;color:#20384f}header{background:#123451;padding:20px}header a{color:white}main{max-width:920px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:14px;margin:16px 0;border:1px solid #dde5ee}li{margin:13px 0}a{color:#12639c}small{color:#61788a}h1{font-size:29px}</style></head><body><header><a href="./">← NEXT BIO 세계뉴스</a></header><main><h1>최근 24시간 뉴스 브리핑</h1><p>발행된 기사 기반 자동 집계입니다. 보도량은 사건 수나 위험도를 의미하지 않습니다.</p><p id="status">불러오는 중</p><section><h2>주요 분야</h2><div id="categories"></div><h2>주요 국가</h2><div id="countries"></div></section><section><h2>최신 기사</h2><ol id="articles"></ol></section></main><script>(async()=>{const el=id=>document.getElementById(id),add=(parent,tag,value)=>{const n=document.createElement(tag);n.textContent=String(value??'');parent.append(n);return n};try{const r=await fetch('./data/daily-briefing.json',{cache:'no-store'});if(!r.ok)throw Error('데이터가 아직 없습니다');const d=await r.json();el('status').textContent='최근 24시간 기사 '+d.article_count+'건 · 집계 '+new Date(d.updated).toLocaleString('ko-KR');for(const [key,id] of [['top_categories','categories'],['top_countries','countries']])add(el(id),'p',(d[key]||[]).map(x=>x.name+' '+x.count+'건').join(' · ')||'자료 없음');for(const a of d.headlines||[]){let u;try{u=new URL(a.url);if(!['https:','http:'].includes(u.protocol))continue}catch{continue}const li=add(el('articles'),'li',''),link=add(li,'a',a.title);link.href=u.href;link.target='_blank';link.rel='noopener noreferrer';add(li,'small',' · '+(a.source||'출처 미상'))}}catch(e){el('status').textContent='브리핑을 불러올 수 없습니다: '+e.message}})();</script></body></html>
