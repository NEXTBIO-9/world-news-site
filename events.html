<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXT BIO | 주요 사건 타임라인</title>
<meta name="description" content="NEXT BIO 세계 주요 사건의 관련 보도와 시간순 원문 링크">
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#19334c;background:#f5f8fc}
*{box-sizing:border-box}body{margin:0}header{background:#123451;color:#fff;padding:22px max(20px,calc((100vw - 1050px)/2))}
header a{color:#fff;text-decoration:none}main{max-width:1050px;margin:auto;padding:26px 18px}
h1{font-size:clamp(24px,4vw,34px);margin:0 0 8px}p{line-height:1.6}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}input,select{padding:12px;border:1px solid #c5d2de;border-radius:9px;font:inherit;max-width:100%}
input{flex:1;min-width:220px}select{min-width:140px}
.event{background:#fff;border:1px solid #dce5ee;border-radius:14px;margin:14px 0;padding:20px;box-shadow:0 3px 12px #173b5b0a}
.event h2{font-size:19px;margin:6px 0 10px}.meta{font-size:13px;color:#60778c}
ol{padding-left:25px}li{padding:9px 0;border-bottom:1px solid #edf1f5}li:last-child{border:0}
li a{color:#135d9a;overflow-wrap:anywhere}time{display:block;font-size:12px;color:#64798b;margin-bottom:4px}
.note{color:#60778c;font-size:13px}#status{min-height:24px}
</style>
</head>
<body>
<header><a href="./">← NEXT BIO 세계 뉴스로 돌아가기</a></header>
<main>
<h1>세계 주요 사건 타임라인</h1>
<p>관련 보도를 시간순으로 모아 보여줍니다. 동일 사건 분류는 자동 추정이며, 여러 보도가 독립적인 사실 검증을 뜻하지는 않습니다.</p>
<div class="toolbar"><input id="search" type="search" placeholder="사건·국가·기사 검색" aria-label="사건 검색"><select id="category" aria-label="분야 선택"><option value="">전체 분야</option></select></div>
<p id="status" role="status">사건 데이터를 불러오는 중입니다.</p>
<section id="events" aria-live="polite"></section>
<p class="note">원문 기사 링크를 통해 사실관계를 직접 확인하세요. 이 화면은 예측이나 위험도 평가를 제공하지 않습니다.</p>
</main>
<script>
(() => {
  const eventsNode=document.getElementById('events'),status=document.getElementById('status');
  const search=document.getElementById('search'),category=document.getElementById('category');
  let events=[];
  function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=String(text);if(cls)el.className=cls;return el;}
  function render(){
    const q=search.value.trim().toLocaleLowerCase(),cat=category.value;
    const shown=events.filter(e=>(!cat||e.category===cat)&&(!q||[e.title,e.category,...(e.countries||[]),...(e.timeline||[]).map(t=>t.title)].join(' ').toLocaleLowerCase().includes(q)));
    eventsNode.replaceChildren();
    status.textContent=shown.length+'개 사건 표시 / 전체 '+events.length+'개';
    if(!shown.length){eventsNode.append(node('p','조건에 맞는 사건이 없습니다.'));return;}
    for(const e of shown){
      const article=node('article',undefined,'event');
      article.append(node('div',[(e.countries||[]).join(' · '),e.category,(e.article_count||0)+'개 기사',(e.distinct_sources||0)+'개 매체'].filter(Boolean).join(' | '),'meta'));
      const heading=node('h2',e.title||'제목 없음');heading.id='event-'+String(e.id||'').replace(/[^a-zA-Z0-9_-]/g,'');article.append(heading);
      const permalink=node('a','사건 링크 복사');permalink.href='#'+heading.id;permalink.addEventListener('click',()=>{if(navigator.clipboard&&location.protocol==='https:')navigator.clipboard.writeText(location.origin+location.pathname+'#'+heading.id).catch(()=>{});});article.append(permalink);
      const list=node('ol');
      for(const t of (e.timeline||[])){
        const li=node('li');const date=t.published?new Date(t.published):null;
        li.append(node('time',date&&!Number.isNaN(date.getTime())?date.toLocaleString('ko-KR'):'발행일 미상'));
        const link=node('a',t.title||'원문 보기');
        try{const url=new URL(t.url);if(!['https:','http:'].includes(url.protocol))continue;link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';}catch{continue;}
        li.append(link,node('div',t.source||'출처 미표시','meta'));list.append(li);
      }
      article.append(list);eventsNode.append(article);
    }
  }
  Promise.resolve().then(async()=>{
    const res=await fetch('./data/event-timelines.json',{cache:'no-store'});
    if(!res.ok)throw Error('데이터가 아직 생성되지 않았습니다');
    const data=await res.json();if(!Array.isArray(data.events))throw Error('데이터 형식이 올바르지 않습니다');
    events=data.events;
    for(const c of [...new Set(events.map(e=>e.category).filter(Boolean))].sort())category.append(node('option',c));
    render();
  }).catch(e=>{status.textContent='타임라인을 표시할 수 없습니다: '+e.message;});
  search.addEventListener('input',render);category.addEventListener('change',render);
})();
</script>
</body></html>
