<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXT BIO | 뉴스 인텔리전스</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17344e;background:#f3f7fb}body{margin:0}header{background:#113b5a;color:white;padding:18px}header a{color:white}main{max-width:1180px;margin:auto;padding:22px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select,button{font:inherit;padding:10px;border:1px solid #b9cad9;border-radius:9px;background:white}input{min-width:210px;flex:2}select{flex:1;min-width:140px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat,article,section.panel{background:white;border:1px solid #dbe5ee;border-radius:12px;padding:16px}.stat strong{font-size:26px;display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin:18px 0}article{margin:12px 0}article a{color:#12639a;font-weight:600}small,.note{color:#60778b}h1{font-size:28px}h2{font-size:19px}button{cursor:pointer}.topics{display:flex;gap:8px;flex-wrap:wrap}.topics button{font-size:13px}#items{max-width:100%} .hide{display:none}</style><style>
/* NEXT BIO command-center visual system; functionality unchanged */
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#101827;color:#e5edf7}
*{box-sizing:border-box}body{background:radial-gradient(ellipse at 50% -15%,#203c5b 0%,#101827 52%);min-height:100vh;color:#e5edf7}
header{background:#0a1220;border-bottom:1px solid #33445c;padding:0 24px;box-shadow:0 6px 25px #0002}
.header-inner{max-width:1280px;margin:auto;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:25px;font-weight:850;letter-spacing:-1px;text-decoration:none!important;color:#f1f5fb}.brand span{color:#69b9ff}.brand small{display:block;color:#9db4ce;font-size:10px;letter-spacing:1.7px;font-weight:600}
.back-link{border:1px solid #49617d;padding:10px 14px;border-radius:9px;color:#d7e9ff;text-decoration:none;font-size:13px}.back-link:hover{background:#233951}
main{max-width:1280px;padding:34px 24px 72px}h1{font-size:clamp(27px,3.3vw,38px);margin:0 0 12px;letter-spacing:-.7px;color:#f4f8ff}h2{color:#eaf3ff;font-size:19px;margin:0 0 17px}.note{color:#a9bdd7;line-height:1.7;max-width:1000px;font-size:14px}#status{color:#91c5ff;font-size:13px;margin:12px 0 22px}
.stats{gap:14px;margin:22px 0}.stat,article,section.panel{background:#1d2a3d;border:1px solid #334963;border-radius:14px;box-shadow:0 10px 28px #050c1829}.stat{padding:20px 22px;color:#a9bdd7;font-size:13px;min-height:112px}.stat strong{font-size:32px;line-height:1.35;color:#f4f8ff;margin-top:9px;font-variant-numeric:tabular-nums}.stat:last-child strong{font-size:14px!important;color:#c8e1ff}.grid{gap:14px;margin:22px 0 32px}.grid section.panel{min-height:170px;padding:22px}.grid section.panel div{color:#b9cce3;font-size:13px;line-height:2;overflow-wrap:anywhere}
.controls{background:#1d2a3d;border:1px solid #334963;border-radius:14px;padding:16px;gap:10px;margin:18px 0 14px;display:grid;grid-template-columns:minmax(220px,2fr) repeat(4,minmax(120px,1fr)) minmax(150px,1.1fr) auto}
input,select,button{background:#142237;color:#e5edf7;border:1px solid #405772;border-radius:9px;padding:12px 11px;min-width:0;width:100%;font-size:13px;outline-offset:2px}input::placeholder{color:#91a7c0}input:focus,select:focus,button:focus-visible{outline:2px solid #71b7ff;border-color:#71b7ff}button{width:auto;background:#29476a;color:#f3f8ff;font-weight:650;cursor:pointer}button:hover{background:#365d87}select option{background:#17263b;color:#fff}
#matches{font-size:13px;color:#9fbedf;margin:18px 0}#items{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px;align-items:start}article{margin:0;padding:20px;transition:border-color .2s,background .2s}article:hover{background:#263951;border-color:#5d84b0}article a{color:#dcecff;font-size:16px;line-height:1.6;text-decoration:none}article a:hover{color:#79bdff;text-decoration:underline}article p{color:#9eb5d0;font-size:12px;line-height:1.7;margin:12px 0}article details{border-top:1px solid #344963;padding-top:12px;color:#9fc5eb;font-size:12px}article summary{cursor:pointer}article details p{font-size:13px;color:#c2d4e9}#more{margin:22px auto;display:block;padding:13px 30px}#more.hide{display:none}
@media(max-width:1050px){.controls{grid-template-columns:repeat(3,minmax(0,1fr))}.controls input:first-child{grid-column:span 2}}
@media(max-width:620px){header{padding:0 16px}.header-inner{min-height:72px}.brand{font-size:21px}.back-link{font-size:11px;padding:8px}main{padding:24px 14px 50px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:15px;min-height:100px}.stat strong{font-size:26px}.grid{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px}.controls input:first-child{grid-column:span 2}.controls input[type=date]{grid-column:span 2}.controls button{grid-column:span 2}#items{grid-template-columns:1fr}}
/* Compact dashboard spacing */
main{padding-top:25px}.stats{gap:10px;margin:14px 0}.stats .stat{padding:13px 16px;min-height:0;box-shadow:none}.stats .stat strong{font-size:26px;line-height:1.2;margin-top:5px}.grid{gap:10px;margin:14px 0 22px}.grid section.panel{padding:16px 18px;min-height:0;box-shadow:none}.grid section.panel h2{margin-bottom:9px}.grid section.panel p{margin:7px 0;line-height:1.65}.controls{padding:12px;gap:8px;margin:12px 0}article{padding:15px 17px;box-shadow:none}article p{margin:8px 0}#items{gap:10px}@media(max-width:620px){.stats .stat{padding:12px}.grid section.panel{padding:14px}}
</style><style>
/* Shared preferences: follow NEXT BIO home light/dark selection */
html.nb-light{color-scheme:light;background:#f3f7fb;color:#17344e}
html.nb-light body{background:#f3f7fb;color:#17344e}
html.nb-light header{background:#fff;border-color:#d7e3ef}
html.nb-light .brand{color:#17344e}html.nb-light .brand small{color:#647c95}
html.nb-light .back-link{color:#21577e;border-color:#bdcfe0}
html.nb-light .back-link:hover{background:#eaf2f9}
html.nb-light h1,html.nb-light h2{color:#17344e}
html.nb-light main>p:not(#status),html.nb-light .notice,html.nb-light .muted,html.nb-light small,html.nb-light .meta{color:#60778b}
html.nb-light #status{color:#245f96}
html.nb-light .card,html.nb-light section,html.nb-light .stat,html.nb-light section.panel,html.nb-light article,html.nb-light .controls{background:#fff;border-color:#dbe5ee;color:#17344e;box-shadow:0 6px 20px #17344e0a}
html.nb-light .card:hover,html.nb-light article:hover{background:#f4f9ff;border-color:#abc6df}
html.nb-light .card strong,html.nb-light .count,html.nb-light .stat strong{color:#17344e}
html.nb-light section div,html.nb-light section p,html.nb-light article p{color:#526b83}
html.nb-light a:not(.brand):not(.back-link){color:#12639a}
html.nb-light th,html.nb-light td{color:#25435f;border-color:#e2eaf2}
html.nb-light #alerts{background:#fff8ef;border-color:#dfbd8b}html.nb-light #alerts h2{color:#9c5b15}
html.nb-light input,html.nb-light select,html.nb-light button{background:#fff;color:#17344e;border-color:#b9cad9}
html.nb-light button{background:#e8f1fa}html.nb-light button:hover{background:#d7e8f7}
html.nb-light article details,html.nb-light section h2:not(:first-child),html.nb-light li{border-color:#e1eaf3}
</style><script>
/* Preferences are shared with the home page; keep original news data intact. */
(function(){
 const root=document.documentElement;
 function theme(){let light=false;try{light=localStorage.getItem('nextbio-theme')==='light'}catch(e){}root.classList.toggle('nb-light',light);}
 theme();window.addEventListener('storage',e=>{if(e.key==='nextbio-theme')theme();if(e.key==='nextbio-title-translation')window.dispatchEvent(new Event('nextbio-translation-preference'))});
 window.NEXTBIO_translationOn=function(){try{return localStorage.getItem('nextbio-title-translation')!=='off'}catch(e){return true}};
 window.NEXTBIO_displayTitle=function(a){return window.NEXTBIO_translationOn()?(a.title_ko||a.title||a.original_title||'제목 없음'):(a.original_title||a.title||'제목 없음')};
})();
</script></head><body>
<header><div class="header-inner"><a class="brand" href="./">NEXT<span>BIO</span><small>GLOBAL BIO & NEWS NETWORK</small></a><a class="back-link" href="./">← 세계 뉴스로 돌아가기</a></div></header><main><h1>세계 뉴스 인텔리전스</h1><p class="note">기사 제목·국가·분야·발행일 기반 탐색 도구입니다. 국가별 보도량은 국가 위험도나 실제 사건 발생 건수를 의미하지 않습니다. 공식 도메인 표시는 내용의 독립 검증을 의미하지 않습니다.</p><p id="status" role="status">데이터 불러오는 중</p>
<div class="stats"><div class="stat">게시 기사<strong id="total">—</strong></div><div class="stat">보도 국가<strong id="countryCount">—</strong></div><div class="stat">뉴스 분야<strong id="categoryCount">—</strong></div><div class="stat">최근 집계<strong id="updated" style="font-size:15px">—</strong></div></div>
<div class="grid"><section class="panel"><h2>국가별 기사 수</h2><div id="countries"></div></section><section class="panel"><h2>분야별 기사 수</h2><div id="categories"></div></section><section class="panel"><h2>날짜별 게시 기사 수</h2><div id="dates"></div></section></div>
<h2>기사 상세 탐색</h2><div class="controls"><input id="search" type="search" placeholder="한글·영문 제목, 언론사 검색" aria-label="기사 검색"><select id="country" aria-label="국가"><option value="">모든 국가</option></select><select id="category" aria-label="분야"><option value="">모든 분야</option></select><select id="topic" aria-label="주제"><option value="">모든 주제</option><option value="military">군사</option><option value="outbreak">감염병</option><option value="disaster">재난</option><option value="clinical">임상·제약</option><option value="market">경제·시장</option></select><select id="source" aria-label="출처"><option value="">모든 출처</option><option value="official_domain">공식 기관 도메인</option><option value="media_or_other">언론·기타</option></select><input id="date" type="date" aria-label="발행일"><button id="reset" type="button">초기화</button></div><p id="matches"></p><div id="items"></div><button id="more" type="button" class="hide">기사 더 보기</button>
</main><script>
const $=id=>document.getElementById(id),mk=(tag,text)=>{const n=document.createElement(tag);n.textContent=String(text??'');return n};
let data=[],visible=30;
const fields=['search','country','category','topic','source','date'];
function render(){const q=$('search').value.trim().toLocaleLowerCase(),country=$('country').value,category=$('category').value,topic=$('topic').value,source=$('source').value,date=$('date').value;
const results=data.filter(a=>(!q||[a.title,a.original_title,a.source,a.publisher_domain].some(s=>String(s||'').toLocaleLowerCase().includes(q)))&&(!country||a.countries.includes(country))&&(!category||a.category===category)&&(!topic||a.topics.includes(topic))&&(!source||a.source_type===source)&&(!date||a.published.startsWith(date)));
$('matches').textContent=results.length+'건 검색됨';$('items').replaceChildren();for(const a of results.slice(0,visible)){let u;try{u=new URL(a.url);if(!['http:','https:'].includes(u.protocol))continue}catch{continue}
const item=mk('article',''),link=mk('a',window.NEXTBIO_displayTitle(a));link.href=u.href;link.target='_blank';link.rel='noopener noreferrer';item.append(link);
item.append(mk('p',[a.source,a.category,a.countries.join(' · '),a.published.slice(0,10),a.source_type==='official_domain'?'공식 도메인':''].filter(Boolean).join(' | ')));
const detail=mk('details',''),summary=mk('summary','원문 제목 비교');detail.append(summary,mk('p',a.original_title));item.append(detail);$('items').append(item)}
$('more').classList.toggle('hide',visible>=results.length)}
(async()=>{try{const r=await fetch('./data/intelligence.json',{cache:'no-store'});if(!r.ok)throw Error('아직 생성되지 않은 데이터');const d=await r.json();data=Array.isArray(d.articles)?d.articles:[];$('total').textContent=d.total_articles;$('countryCount').textContent=(d.countries||[]).length;$('categoryCount').textContent=(d.categories||[]).length;$('updated').textContent=new Date(d.updated).toLocaleString('ko-KR');
for(const [key,container,select] of [['countries','countries','country'],['categories','categories','category']]){for(const v of d[key]||[]){const opt=mk('option',v.name);opt.value=v.name;$(select).append(opt)}$(container).append(mk('p',(d[key]||[]).slice(0,15).map(v=>v.name+' '+v.articles+'건').join(' · ')||'자료 없음'))}
$('dates').append(mk('p',(d.daily_counts||[]).slice(-14).map(v=>v.date+' '+v.articles+'건').join(' · ')||'자료 없음'));
$('status').textContent='게시된 기사만 검색합니다. 자동 분류는 참고용입니다.';render()}catch(e){$('status').textContent='데이터를 불러오지 못했습니다: '+e.message}})();
window.addEventListener('nextbio-translation-preference',render);for(const id of fields)$(id).addEventListener('input',()=>{visible=30;render()});$('reset').addEventListener('click',()=>{for(const id of fields)$(id).value='';visible=30;render()});$('more').addEventListener('click',()=>{visible+=30;render()});
</script></body></html>
