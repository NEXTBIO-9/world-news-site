</style><style>
/* NEXT BIO shared dark command-center design */
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#101827;color:#e5edf7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#203c5b 0%,#101827 52%);min-height:100vh;color:#e5edf7}
header{background:#0a1220;border-bottom:1px solid #33445c;padding:0 24px;box-shadow:0 6px 25px #0002}
.header-inner{max-width:1280px;margin:auto;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:25px;font-weight:850;letter-spacing:-1px;text-decoration:none!important;color:#f1f5fb}.brand span{color:#69b9ff}.brand small{display:block;color:#9db4ce;font-size:10px;letter-spacing:1.7px;font-weight:600}
.back-link{border:1px solid #49617d;padding:10px 14px;border-radius:9px;color:#d7e9ff;text-decoration:none;font-size:13px}.back-link:hover{background:#233951}
main{max-width:1280px;margin:auto;padding:34px 24px 72px}h1{font-size:clamp(27px,3.3vw,38px);margin:0 0 12px;letter-spacing:-.7px;color:#f4f8ff}h2{font-size:19px;color:#eaf3ff;margin:0 0 17px}
.notice,.muted,main>p:not(#status){color:#a9bdd7;line-height:1.7;font-size:14px}#status{color:#91c5ff;font-size:13px;margin:12px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px;margin:22px 0}
.card,section:not(.card){background:#1d2a3d;border:1px solid #334963;border-radius:14px;box-shadow:0 10px 28px #050c1829;padding:22px}
.card{transition:border-color .2s,background .2s}.card:hover{border-color:#5d84b0;background:#24364d}.card strong,.count{color:#f4f8ff;font-size:30px;line-height:1.4;font-variant-numeric:tabular-nums}.meta,small{color:#a9bdd7;font-size:13px}
a{color:#9bccff;overflow-wrap:anywhere}a:hover{color:#d7ebff}li{margin:13px 0;line-height:1.7}p{line-height:1.65}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #344963;color:#c8d8eb}th{color:#e7f2ff}#alerts{border-color:#946a48;background:#302b30}#alerts h2{color:#ffcd95}
@media(max-width:620px){header{padding:0 16px}.header-inner{min-height:72px}.brand{font-size:21px}.back-link{font-size:11px;padding:8px}main{padding:24px 14px 50px}.grid{grid-template-columns:1fr 1fr}.card,section:not(.card){padding:16px}.card strong,.count{font-size:25px}table{font-size:12px}th,td{padding:9px 5px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}}

/* Compact operations layout: less unused space in status cards */
#cards.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 18px}
#cards .card{padding:13px 16px;min-height:0;box-shadow:none}
#cards .card span{display:block;font-size:13px;line-height:1.4}
#cards .card strong{font-size:26px;line-height:1.2;margin-top:5px}
#alerts{padding:15px 18px;margin:12px 0}
#alerts h2{margin:0 0 7px;font-size:17px}
#alerts p{margin:5px 0;font-size:13px}
main>section:not(#alerts){padding:17px 20px;margin:12px 0}
main>section:not(#alerts) h2{margin-bottom:10px}
@media(max-width:760px){#cards.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){#cards .card{padding:12px}#cards .card strong{font-size:24px}}
</style><style>

html.nb-light header{background:#fff;border-color:#d7e3ef}
html.nb-light .brand{color:#17344e}html.nb-light .brand small{color:#647c95}

html.nb-light h1,html.nb-light h2{color:#17344e}
html.nb-light main>p:not(#status),html.nb-light .notice,html.nb-light .muted,html.nb-light small,html.nb-light .meta{color:#60778b}

html.nb-light .card,html.nb-light section,html.nb-light .stat,html.nb-light section.panel,html.nb-light article,html.nb-light .controls{background:#fff;border-color:#dbe5ee;color:#17344e;box-shadow:0 6px 20px #17344e0a}

html.nb-light th,html.nb-light td{color:#25435f;border-color:#e2eaf2}

html.nb-light input,html.nb-light select,html.nb-light button{background:#fff;color:#17344e;border-color:#b9cad9}
html.nb-light button{background:#e8f1fa}html.nb-light button:hover{background:#d7e8f7}
html.nb-light article details,html.nb-light section h2:not(:first-child),html.nb-light li{border-color:#e1eaf3}

/* Operations palette: explicitly cover every visible dashboard surface */
html.nb-light body #cards .card,html.nb-light body main>section:not(#alerts){background:#fff;border-color:#dbe5ee;color:#17344e}
html.nb-light body #cards .card strong{color:#17344e}
html.nb-light body #cards .card span{color:#526b83}

html:not(.nb-light) body #cards .card strong{color:#f4f8ff}
html:not(.nb-light) body #cards .card span{color:#b5c9df}

</style><script>
/* Preferences are shared with the home page; keep original news data intact. */
(function(){
 const root=document.documentElement;
 function theme(){root.classList.remove('nb-light');}
 theme();window.addEventListener('storage',e=>{if(e.key==='nextbio-theme')theme();if(e.key==='nextbio-title-translation')window.dispatchEvent(new Event('nextbio-translation-preference'))});
 window.NEXTBIO_translationOn=function(){try{return localStorage.getItem('nextbio-title-translation')!=='off'}catch(e){return true}};
 window.NEXTBIO_displayTitle=function(a){return window.NEXTBIO_translationOn()?(a.title_ko||a.title||a.original_title||'제목 없음'):(a.original_title||a.title||'제목 없음')};
})();
</script><link rel="stylesheet" href="./nextbio-translation.css?v=2"><script src="./nextbio-translation.js?v=2" defer></script></head><body>
<header><div class="header-inner"><a class="brand" href="./">NEXT<span>BIO</span><small>GLOBAL BIO & NEWS NETWORK</small></a><a class="back-link" href="./">← 세계 뉴스로 돌아가기</a></div></header>
<main><h1>뉴스 운영 현황</h1><p class="muted">최근 저장된 수집·게시 감사 데이터입니다. 실시간 서버 모니터링이 아니며, 갱신 시각을 확인하세요.</p>
<p id="status" role="status">데이터를 불러오는 중입니다.</p><section id="alerts" aria-label="운영 경고" hidden></section><div id="cards" class="grid"></div><section><h2>수집·게시 상태</h2><table><tbody id="details"></tbody></table></section>
</main>
<script>
(async()=>{
const status=document.getElementById('status'),cards=document.getElementById('cards'),details=document.getElementById('details'),alerts=document.getElementById('alerts');
const add=(parent,tag,value)=>{const n=document.createElement(tag);n.textContent=String(value??'정보 없음');parent.append(n);return n};
try{
const response=await fetch('./data/news_quality_audit.json',{cache:'no-store'});if(!response.ok)throw Error('감사 데이터가 아직 없습니다');
const data=await response.json(),pub=data.publication||{};
const warnings=[];
if(Number(pub.pending_overflow)>0)warnings.push('대기열 초과로 보존하지 못한 기사가 있습니다.');
if(Number(pub.important_pending)>0)warnings.push('중요 기사 '+pub.important_pending+'개가 게시 대기 중입니다.');
if(Number(data.attempted_feeds)>0&&Number(data.feed_success_rate)<0.5)warnings.push('수집 피드 성공률이 50% 미만입니다.');
const last=Date.parse(pub.updated||data.updated||'');
if(Number.isFinite(last)&&Date.now()-last>3*3600000)warnings.push('마지막 감사 기록이 3시간 이상 지났습니다.');
if(warnings.length){alerts.hidden=false;add(alerts,'h2','확인 필요');for(const warning of warnings)add(alerts,'p',warning)}
const metrics=[['게시 기사',pub.published],['중요 게시 기사',pub.important_published],['게시 대기',pub.pending],['중요 기사 대기',pub.important_pending],['대기열 초과',pub.pending_overflow],['수집 성공 피드',data.successful_feeds]];
for(const [name,value] of metrics){const card=add(cards,'div','');card.className='card';add(card,'span',name);add(card,'strong',value??'—')}
for(const [name,value] of [['수집 성공 / 전체',String(data.successful_feeds??'—')+' / '+String(data.attempted_feeds??'—')],['수집 성공률',data.feed_success_rate==null?'—':(data.feed_success_rate*100).toFixed(1)+'%'],['중복 병합',data.event_duplicates_merged],['제외 기사',data.excluded_total],['게시 감사 갱신',pub.updated],['수집 감사 갱신',data.updated]]){
const tr=document.createElement('tr');add(tr,'th',name);add(tr,'td',value);details.append(tr)}
status.textContent='';
}catch(e){status.textContent='운영 현황을 불러올 수 없습니다: '+e.message}
})();
</script></body></html>
