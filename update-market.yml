
name: Update NEXT BIO market quotes

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install market data client
        run: python -m pip install 'yfinance>=0.2.54,<2'
      - name: Fetch market quotes
        run: python scripts/fetch_market.py
      - name: Commit updated quotes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update market quotes'
            git push
          fi
