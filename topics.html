<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXT BIO | 분야별 동향</title>
<style>body{margin:0;font:16px system-ui,-apple-system,sans-serif;background:#f5f8fc;color:#1d364e}header{background:#123451;padding:20px}header a{color:white}main{max-width:1060px;margin:auto;padding:22px}h1{font-size:29px}.notice{color:#5d7184;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}.card{background:white;border:1px solid #dce5ee;border-radius:14px;padding:18px}h2{font-size:20px;margin:0 0 8px}.count{font-size:25px;font-weight:700}.meta{font-size:13px;color:#687e90}li{margin:12px 0}a{color:#165e98;overflow-wrap:anywhere}</style></head>
<body><header><a href="./">← NEXT BIO 세계 뉴스</a></header><main><h1>세계 뉴스 분야별 동향</h1><p class="notice">군사·분쟁, 감염병, 재난, 경제, 바이오 분야의 보도 현황입니다. 기사 건수는 실제 사건 수·위험도·확산 규모를 의미하지 않으며 미래 예측이 아닙니다.</p><p id="status" role="status">자료 불러오는 중</p><div id="grid" class="grid"></div></main>
<script>(async()=>{const status=document.getElementById('status'),grid=document.getElementById('grid');const make=(tag,value)=>{const n=document.createElement(tag);n.textContent=String(value??'');return n};try{const response=await fetch('./data/topic-monitor.json',{cache:'no-store'});if(!response.ok)throw Error('아직 데이터가 생성되지 않았습니다');const data=await response.json();if(!data.topics||typeof data.topics!=='object')throw Error('데이터 형식 오류');for(const topic of Object.values(data.topics)){const card=make('section','');card.className='card';card.append(make('h2',topic.label),make('div',(topic.article_count??0)+'개 관련 기사'));const countries=make('p',(topic.countries||[]).slice(0,6).map(c=>c.name+' '+c.articles+'건').join(' · '));countries.className='meta';card.append(countries);const list=make('ul','');for(const item of topic.latest||[]){try{const u=new URL(item.url);if(!['https:','http:'].includes(u.protocol))continue;const li=make('li',''),a=make('a',item.title);a.href=u.href;a.rel='noopener noreferrer';a.target='_blank';li.append(a);list.append(li)}catch{}}card.append(list);grid.append(card)}const dt=new Date(data.updated);status.textContent='최근 집계: '+(Number.isNaN(dt.getTime())?'시각 미상':dt.toLocaleString('ko-KR'))}catch(e){status.textContent='동향 데이터를 불러오지 못했습니다: '+e.message}})();</script></body></html>
