<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXT BIO | 분야별 동향</title>
<style>body{margin:0;font:16px system-ui,-apple-system,sans-serif;background:#f5f8fc;color:#1d364e}header{background:#123451;padding:20px}header a{color:white}main{max-width:1060px;margin:auto;padding:22px}h1{font-size:29px}.notice{color:#5d7184;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}.card{background:white;border:1px solid #dce5ee;border-radius:14px;padding:18px}h2{font-size:20px;margin:0 0 8px}.count{font-size:25px;font-weight:700}.meta{font-size:13px;color:#687e90}li{margin:12px 0}a{color:#165e98;overflow-wrap:anywhere}</style><style>
/* NEXT BIO shared dark command-center design */
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#101827;color:#e5edf7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#203c5b 0%,#101827 52%);min-height:100vh;color:#e5edf7}
header{background:#0a1220;border-bottom:1px solid #33445c;padding:0 24px;box-shadow:0 6px 25px #0002}
.header-inner{max-width:1280px;margin:auto;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:25px;font-weight:850;letter-spacing:-1px;text-decoration:none!important;color:#f1f5fb}.brand span{color:#69b9ff}.brand small{display:block;color:#9db4ce;font-size:10px;letter-spacing:1.7px;font-weight:600}
.back-link{border:1px solid #49617d;padding:10px 14px;border-radius:9px;color:#d7e9ff;text-decoration:none;font-size:13px}.back-link:hover{background:#233951}
main{max-width:1280px;margin:auto;padding:34px 24px 72px}h1{font-size:clamp(27px,3.3vw,38px);margin:0 0 12px;letter-spacing:-.7px;color:#f4f8ff}h2{font-size:19px;color:#eaf3ff;margin:0 0 17px}
.notice,.muted,main>p:not(#status){color:#a9bdd7;line-height:1.7;font-size:14px}#status{color:#91c5ff;font-size:13px;margin:12px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px;margin:22px 0}
.card,section:not(.card){background:#1d2a3d;border:1px solid #334963;border-radius:14px;box-shadow:0 10px 28px #050c1829;padding:22px}
.card{transition:border-color .2s,background .2s}.card:hover{border-color:#5d84b0;background:#24364d}.card strong,.count{color:#f4f8ff;font-size:30px;line-height:1.4;font-variant-numeric:tabular-nums}.meta,small{color:#a9bdd7;font-size:13px}
a{color:#9bccff;overflow-wrap:anywhere}a:hover{color:#d7ebff}li{margin:13px 0;line-height:1.7}p{line-height:1.65}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #344963;color:#c8d8eb}th{color:#e7f2ff}#alerts{border-color:#946a48;background:#302b30}#alerts h2{color:#ffcd95}
@media(max-width:620px){header{padding:0 16px}.header-inner{min-height:72px}.brand{font-size:21px}.back-link{font-size:11px;padding:8px}main{padding:24px 14px 50px}.grid{grid-template-columns:1fr 1fr}.card,section:not(.card){padding:16px}.card strong,.count{font-size:25px}table{font-size:12px}th,td{padding:9px 5px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}}
/* Compact dashboard spacing */
main{padding-top:25px}.grid{gap:10px;margin:14px 0}.grid .card{padding:15px 17px;box-shadow:none}.grid .card h2{margin-bottom:7px;font-size:17px}.grid .card p{margin:8px 0}.grid .card li{margin:7px 0}.count{font-size:24px}
</style><style>
/* Shared preferences: follow NEXT BIO home light/dark selection */
html.nb-light{color-scheme:light;background:#f3f7fb;color:#17344e}
html.nb-light body{background:#f3f7fb;color:#17344e}
html.nb-light header{background:#fff;border-color:#d7e3ef}
html.nb-light .brand{color:#17344e}html.nb-light .brand small{color:#647c95}
html.nb-light .back-link{color:#21577e;border-color:#bdcfe0}
html.nb-light .back-link:hover{background:#eaf2f9}
html.nb-light h1,html.nb-light h2{color:#17344e}
html.nb-light main>p:not(#status),html.nb-light .notice,html.nb-light .muted,html.nb-light small,html.nb-light .meta{color:#60778b}
html.nb-light #status{color:#245f96}
html.nb-light .card,html.nb-light section,html.nb-light .stat,html.nb-light section.panel,html.nb-light article,html.nb-light .controls{background:#fff;border-color:#dbe5ee;color:#17344e;box-shadow:0 6px 20px #17344e0a}
html.nb-light .card:hover,html.nb-light article:hover{background:#f4f9ff;border-color:#abc6df}
html.nb-light .card strong,html.nb-light .count,html.nb-light .stat strong{color:#17344e}
html.nb-light section div,html.nb-light section p,html.nb-light article p{color:#526b83}
html.nb-light a:not(.brand):not(.back-link){color:#12639a}
html.nb-light th,html.nb-light td{color:#25435f;border-color:#e2eaf2}
html.nb-light #alerts{background:#fff8ef;border-color:#dfbd8b}html.nb-light #alerts h2{color:#9c5b15}
html.nb-light input,html.nb-light select,html.nb-light button{background:#fff;color:#17344e;border-color:#b9cad9}
html.nb-light button{background:#e8f1fa}html.nb-light button:hover{background:#d7e8f7}
html.nb-light article details,html.nb-light section h2:not(:first-child),html.nb-light li{border-color:#e1eaf3}
</style><script>
/* Preferences are shared with the home page; keep original news data intact. */
(function(){
 const root=document.documentElement;
 function theme(){let light=false;try{light=localStorage.getItem('nextbio-theme')==='light'}catch(e){}root.classList.toggle('nb-light',light);}
 theme();window.addEventListener('storage',e=>{if(e.key==='nextbio-theme')theme();if(e.key==='nextbio-title-translation')window.dispatchEvent(new Event('nextbio-translation-preference'))});
 window.NEXTBIO_translationOn=function(){try{return localStorage.getItem('nextbio-title-translation')!=='off'}catch(e){return true}};
 window.NEXTBIO_displayTitle=function(a){return window.NEXTBIO_translationOn()?(a.title_ko||a.title||a.original_title||'제목 없음'):(a.original_title||a.title||'제목 없음')};
})();
</script><style>.nb-news-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;list-style:none;background:#233750;border:1px solid #496684;border-radius:10px;padding:12px;margin:8px 0}.nb-news-main,.nb-news-summary{min-width:0}.nb-news-summary{border-left:1px solid #49617b;padding-left:12px}.nb-news-tag{display:block;color:#76baff;font-size:11px}.nb-news-row a{color:#f2f7ff;font-weight:700;font-size:13px}.nb-news-original,.nb-news-meta,.nb-news-excerpt{color:#b8d0eb;font-size:11px;line-height:1.5;margin:5px 0}#articles{padding-left:0}html.nb-light .nb-news-row{background:#f8fbff;border-color:#d5e2ee}html.nb-light .nb-news-row a{color:#17344e}html.nb-light .nb-news-original,html.nb-light .nb-news-meta,html.nb-light .nb-news-excerpt{color:#526b83}html.nb-light .nb-news-summary{border-color:#d5e2ee}@media(max-width:620px){.nb-news-row{grid-template-columns:1fr}.nb-news-summary{border-left:0;border-top:1px solid #49617b;padding:9px 0 0}}</style><script>
window.NEXTBIO_makeNewsRow=function(a){const row=document.createElement('li');row.className='nb-news-row';const left=document.createElement('div'),right=document.createElement('div');left.className='nb-news-main';right.className='nb-news-summary';const add=(p,t,v,cl)=>{const n=document.createElement(t);n.textContent=String(v||'');if(cl)n.className=cl;p.append(n);return n};add(left,'span',(a.category||'세계 뉴스')+' · NEWS','nb-news-tag');const link=add(left,'a',window.NEXTBIO_displayTitle(a));link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';const original=a.original_title||(a.title_ko?a.title:'');if(window.NEXTBIO_translationOn()&&original&&original!==link.textContent)add(left,'p',original,'nb-news-original');add(left,'p',[Array.isArray(a.countries)?a.countries.join(' · '):'',a.source,a.published&&String(a.published).slice(0,10)].filter(Boolean).join(' · '),'nb-news-meta');const summary=a.summary_ko||a.summary||a.description_ko||a.description||'';add(right,'span',summary?'기사 요약':'기사 정보','nb-news-tag');add(right,'p',summary||'요약 정보가 제공되지 않은 기사입니다.','nb-news-excerpt');row.append(left,right);return row};
</script></head>
<body><header><div class="header-inner"><a class="brand" href="./">NEXT<span>BIO</span><small>GLOBAL BIO & NEWS NETWORK</small></a><a class="back-link" href="./">← 세계 뉴스로 돌아가기</a></div></header><main><h1>세계 뉴스 분야별 동향</h1><p class="notice">군사·분쟁, 감염병, 재난, 경제, 바이오 분야의 보도 현황입니다. 기사 건수는 실제 사건 수·위험도·확산 규모를 의미하지 않으며 미래 예측이 아닙니다.</p><p id="status" role="status">자료 불러오는 중</p><div id="grid" class="grid"></div></main>
<script>(async()=>{const status=document.getElementById('status'),grid=document.getElementById('grid');const make=(tag,value)=>{const n=document.createElement(tag);n.textContent=String(value??'');return n};try{const response=await fetch('./data/topic-monitor.json',{cache:'no-store'});if(!response.ok)throw Error('아직 데이터가 생성되지 않았습니다');const data=await response.json();if(!data.topics||typeof data.topics!=='object')throw Error('데이터 형식 오류');for(const topic of Object.values(data.topics)){const card=make('section','');card.className='card';card.append(make('h2',topic.label),make('div',(topic.article_count??0)+'개 관련 기사'));const countries=make('p',(topic.countries||[]).slice(0,6).map(c=>c.name+' '+c.articles+'건').join(' · '));countries.className='meta';card.append(countries);const list=make('ul','');for(const item of topic.latest||[]){try{const u=new URL(item.url);if(!['https:','http:'].includes(u.protocol))continue;list.append(window.NEXTBIO_makeNewsRow(item))}catch{}}card.append(list);grid.append(card)}const dt=new Date(data.updated);status.textContent='최근 집계: '+(Number.isNaN(dt.getTime())?'시각 미상':dt.toLocaleString('ko-KR'))}catch(e){status.textContent='동향 데이터를 불러오지 못했습니다: '+e.message}})();</script><script>window.addEventListener('nextbio-translation-preference',()=>location.reload());</script></body></html>
