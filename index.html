<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXT BIO | 세계 뉴스 지도</title><meta name="description" content="NEXT BIO 직접 제작 세계지도, 최신 세계뉴스, 한국어 번역, 기사 요약"><link rel="stylesheet" href="world-home.css"><link rel="stylesheet" href="nextbio-right-summary.css"><link rel="stylesheet" href="nextbio-translation.css"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081421;color:#e7f0f9;font-family:system-ui,'Malgun Gothic',sans-serif}body.light{background:#f2f6fa;color:#172a3e}header{padding:18px 4%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #46607a66}.brand{font-size:24px;font-weight:900;letter-spacing:.08em}.brand span{color:#4fc3ed}button,input{font:inherit}button{cursor:pointer;border:1px solid #66809a;background:#1d3954;color:#fff;border-radius:9px;padding:9px 12px}body.light button{background:#e4edf5;color:#172a3e}main{max-width:1550px;margin:auto;padding:20px 3%}.hero h1{margin:8px 0;font-size:clamp(24px,3vw,40px)}.hero p{opacity:.7}.dashboard{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:18px}.panel{border:1px solid #6b879e55;border-radius:15px;overflow:hidden;background:#13283b}body.light .panel{background:white}#map{height:min(66vh,650px);min-height:410px;position:relative}#mapcount,#count{font-size:13px;opacity:.75}.panel-head{padding:14px 17px;display:flex;justify-content:space-between;align-items:center;gap:10px}.feed-controls{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}.feed-controls input{flex:1;min-width:150px;background:transparent;border:1px solid #7c92a9;color:inherit;padding:10px;border-radius:8px}.feed-list{height:min(62vh,600px);overflow:auto;padding:0 12px}.article{display:block;text-decoration:none;color:inherit;border-top:1px solid #7791a233;padding:14px 4px}.article h3{font-size:15px;line-height:1.5;margin:5px 0}.tag{font-size:11px;color:#5ac8f3}.meta{font-size:11px;opacity:.65}.summary{font-size:12px;opacity:.8;margin:6px 0;line-height:1.5}.row-actions{display:flex;gap:8px;align-items:center}.bookmark{padding:5px 9px}.bookmark.active{color:#ffdb6b}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.notice{font-size:12px;opacity:.7;margin:25px 0}#more{margin:12px}#tour.active{background:#197b8c}@media(max-width:850px){.dashboard{grid-template-columns:1fr}#map{height:50vh;min-height:300px}.feed-list{height:65vh}}</style></head><body><header><div class="brand">NEXT <span>BIO</span> <small style="font-size:11px;display:block;font-weight:400">GLOBAL NEWS WORLD MAP</small></div><button id="theme">☀ 테마</button></header><main><section class="hero"><h1>글로벌 뉴스 상황실</h1><p>직접 제작한 세계지도 · 국가별 뉴스 · 한국어 번역 · 기사 요약</p></section><div class="toolbar"><button id="tour">▶ 국가 자동 순회</button><button id="clear-country">전체 국가</button><button id="saved-toggle">☆ 북마크만 보기</button><button id="export">북마크 내보내기</button><button id="import-btn">북마크 가져오기</button><input id="import-file" type="file" accept="application/json" hidden></div><div class="dashboard"><section class="panel"><div class="panel-head"><strong>세계 뉴스 지도</strong><span id="mapcount">지도 로딩 중</span></div><div id="map" aria-label="국가별 뉴스 지도"></div></section><section class="panel"><div class="panel-head"><strong id="feedtitle">최신 세계뉴스</strong><span id="count">뉴스 로딩 중</span></div><div class="feed-controls"><input id="search" type="search" placeholder="국가 · 제목 · 출처 검색" aria-label="뉴스 검색"><button id="translate">한국어 ON</button></div><div id="articles" class="feed-list" aria-live="polite">뉴스를 불러오는 중입니다.</div><button id="more" hidden>기사 더 보기</button></section></div><p class="notice">기사 원문은 각 언론사에서 확인하세요. 국가 분류는 기사 정보에 따른 자동 추정입니다. 지도는 NEXT BIO의 SVG 기반 자체 제작 지도입니다.</p></main><script src="nextbio-native-map.js"></script><script src="world-home-restored.js"></script></body></html>
