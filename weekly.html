<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXT BIO | 주간 보고서</title><style>body{margin:0;font:16px system-ui,sans-serif;background:#f4f7fb;color:#20384f}header{background:#123451;padding:20px}header a{color:white}main{max-width:920px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:14px;margin:16px 0;border:1px solid #dde5ee}li{margin:13px 0}a{color:#12639c}small{color:#61788a}h1{font-size:29px}</style><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#101827;color:#e5edf7}*{box-sizing:border-box}body{background:radial-gradient(ellipse at 50% -15%,#203c5b 0%,#101827 52%);min-height:100vh;color:#e5edf7}header{background:#0a1220;border-bottom:1px solid #33445c;padding:0 24px;box-shadow:0 6px 25px #0002}.header-inner{max-width:1280px;margin:auto;min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{font-size:25px;font-weight:850;letter-spacing:-1px;text-decoration:none!important;color:#f1f5fb}.brand span{color:#69b9ff}.brand small{display:block;color:#9db4ce;font-size:10px;letter-spacing:1.7px;font-weight:600}.back-link{border:1px solid #49617d;padding:10px 14px;border-radius:9px;color:#d7e9ff;text-decoration:none;font-size:13px}.back-link:hover{background:#233951}main{max-width:1280px;padding:34px 24px 72px}h1{font-size:clamp(27px,3.3vw,38px);margin:0 0 12px;letter-spacing:-.7px;color:#f4f8ff}h2{font-size:19px;color:#eaf3ff;margin:0 0 17px}main>p:not(#status){color:#a9bdd7;line-height:1.7;font-size:14px}#status{color:#91c5ff;font-size:13px;margin:12px 0 22px}section{background:#1d2a3d;border:1px solid #334963;border-radius:14px;box-shadow:0 10px 28px #050c1829;padding:22px;margin:18px 0;color:#c8d8eb}section div{line-height:1.9;color:#b9cce3}section h2:not(:first-child){margin-top:26px;padding-top:20px;border-top:1px solid #344963}a{color:#9bccff;overflow-wrap:anywhere}a:hover{color:#d7ebff}li{margin:13px 0;line-height:1.7;padding:9px 4px;border-bottom:1px solid #344963}li:last-child{border-bottom:0}small{color:#a9bdd7;font-size:12px}@media(max-width:620px){header{padding:0 16px}.header-inner{min-height:72px}.brand{font-size:21px}.back-link{font-size:11px;padding:8px}main{padding:24px 14px 50px}section{padding:16px}}
/* Compact dashboard spacing */
main{padding-top:25px}main>section{padding:16px 19px;margin:11px 0;box-shadow:none}main>section h2{margin:0 0 10px;font-size:18px}main>section h2:not(:first-child){margin-top:15px;padding-top:13px}main>section p{margin:7px 0}main>section li{margin:6px 0;padding:6px 2px}#status{margin:9px 0 14px}
</style><style>

html.nb-light{color-scheme:light;background:#f3f7fb;color:#17344e}

</style><script>
/* Preferences are shared with the home page; keep original news data intact. */
(function(){
 const root=document.documentElement;
 function theme(){let light=false;try{light=localStorage.getItem('nextbio-theme')==='light'}catch(e){}root.classList.toggle('nb-light',light);}
 theme();window.addEventListener('storage',e=>{if(e.key==='nextbio-theme')theme();if(e.key==='nextbio-title-translation')window.dispatchEvent(new Event('nextbio-translation-preference'))});
 window.NEXTBIO_translationOn=function(){try{return localStorage.getItem('nextbio-title-translation')!=='off'}catch(e){return true}};
 window.NEXTBIO_displayTitle=function(a){return window.NEXTBIO_translationOn()?(a.title_ko||a.title||a.original_title||'제목 없음'):(a.original_title||a.title||'제목 없음')};
})();
</script></head><body><header><div class="header-inner"><a class="brand" href="./">NEXT<span>BIO</span><small>GLOBAL BIO & NEWS NETWORK</small></a><a class="back-link" href="./">← 세계 뉴스로 돌아가기</a></div></header><main><h1>최근 7일 뉴스 보고서</h1><p>발행된 기사 기준의 보도량 집계입니다. 사건 수나 실제 위험도를 의미하지 않습니다.</p><p id="status">불러오는 중</p><section><h2>분야별 보도량</h2><div id="categories"></div><h2>국가별 보도량</h2><div id="countries"></div></section><section><h2>기사 출처</h2><ol id="articles"></ol></section></main><script>(async()=>{const el=id=>document.getElementById(id),add=(parent,tag,value)=>{const n=document.createElement(tag);n.textContent=String(value??'');parent.append(n);return n};try{const r=await fetch('./data/weekly-report.json',{cache:'no-store'});if(!r.ok)throw Error('데이터가 아직 없습니다');const d=await r.json();el('status').textContent='최근 7일 '+d.article_count+'건 · 집계 '+new Date(d.updated).toLocaleString('ko-KR');for(const [key,id] of [['categories','categories'],['countries','countries']])add(el(id),'p',(d[key]||[]).map(x=>x.name+' '+x.articles+'건').join(' · ')||'자료 없음');for(const a of d.headlines||[]){let u;try{u=new URL(a.url);if(!['https:','http:'].includes(u.protocol))continue}catch{continue}el('articles').append(window.NEXTBIO_makeNewsRow(a))}}catch(e){el('status').textContent='보고서를 불러올 수 없습니다: '+e.message}})();</script><script>window.addEventListener('nextbio-translation-preference',()=>location.reload());</script></body></html>
