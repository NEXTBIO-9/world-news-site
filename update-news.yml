
name: Update news feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: world-news-feed-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect public RSS headlines
        run: |
          python scripts/fetch_news.py

      - name: Install free offline translation engine
        run: |
          python -m pip install --disable-pip-version-check 'argostranslate==1.9.6'

      - name: Translate English headlines locally (no paid API)
        env:
          TRANSLATE_MAX_NEW: "100"
        run: |
          python translate_titles.py

      - name: Report translated headlines
        run: |
          python - <<'PYREPORT'
          import json
          data = json.load(open('data/articles.json', encoding='utf-8'))
          articles = data.get('articles', [])
          count = sum(bool(a.get('title_ko')) for a in articles if isinstance(a, dict))
          print(f'Korean titles: {count}/{len(articles)}')
          if count == 0:
              print('WARNING: No Korean titles generated; inspect translation step logs.')
          PYREPORT

      - name: Commit updated feed
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data/articles.json /tmp/world-news-articles.json

          for attempt in 1 2 3 4 5; do
            echo "Push attempt: $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/world-news-articles.json data/articles.json
            git add data/articles.json

            if git diff --cached --quiet; then
              echo "No news changes to commit."
              exit 0
            fi

            git commit -m "Update news feed"

            if git push origin HEAD:main; then
              echo "News feed updated successfully."
              exit 0
            fi

            echo "Push conflict; retrying..."
            sleep 5
          done

          echo "Failed to push news feed after 5 attempts."
          exit 1
