name: Update verified emergency ticker
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: nextbio-emergency-ticker
  cancel-in-progress: false
jobs:
  emergency:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fresh emergency events from official sources
        run: python scripts/update_emergency_news.py
      - name: Publish verified emergency feed safely
        shell: bash
        run: |
          set -euo pipefail
          cp data/emergency-news.json /tmp/nextbio-emergency-news.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nextbio-emergency-news.json data/emergency-news.json
            git add data/emergency-news.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update verified emergency news ticker'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
