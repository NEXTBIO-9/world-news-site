name: Update Korean stock intelligence
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stock-news-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Korean-language investment news
        run: python scripts/update_stock_articles.py
      - name: Commit changes if updated
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock/data/articles.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Korean stock intelligence articles'
            git push
          fi
