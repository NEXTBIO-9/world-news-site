name: Build source-grounded news summaries v11
on:
  workflow_dispatch:
  schedule:
    - cron: '8,23,38,53 * * * *'
permissions:
  contents: write
concurrency:
  group: nextbio-summary-cache
  cancel-in-progress: false
jobs:
  summaries:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight article extraction
        run: pip install 'requests>=2.31,<3' 'trafilatura>=1.12,<3' 'googlenewsdecoder>=0.1.7,<1'
      - name: Extract excerpts with multi-route Google News resolver
        env:
          SUMMARY_MAX_NEW: '35'
          SUMMARY_TIME_BUDGET: '360'
        run: python scripts/build_article_summaries.py
      - name: Commit summary cache without overwriting news
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/article-summaries.json /tmp/nextbio-summaries.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nextbio-summaries.json data/article-summaries.json
            git add data/article-summaries.json
            if git diff --cached --quiet; then echo 'No new summaries'; exit 0; fi
            git commit -m 'Update source-grounded news summaries'
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
