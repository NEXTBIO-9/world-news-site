name: Build and translate source-grounded summaries v20
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Update news feed'
    types:
      - completed
permissions:
  contents: write
  actions: read
concurrency:
  group: nextbio-news-pipeline
  cancel-in-progress: false
jobs:
  titles:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate news pipeline Python and priority rules
        run: |
          python -m compileall -q scripts
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Download unpublished feed from successful collection
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: nextbio-unpublished-news
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nextbio-staged
      - name: Use current feed for manual backfill
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p /tmp/nextbio-staged
          cp data/articles.json /tmp/nextbio-staged/articles.json
          if [ -f data/news_quality_audit.json ]; then cp data/news_quality_audit.json /tmp/nextbio-staged/news_quality_audit.json; fi
      - name: Add retained untranslated headlines to translation candidates
        run: python scripts/publish_translated_news.py prepare /tmp/nextbio-staged/articles.json /tmp/nextbio-translation-candidates.json
      - name: Check whether Korean headline translation is needed
        id: title_gate
        env:
          TITLE_KO_FEED: /tmp/nextbio-translation-candidates.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.translate_news_titles import pending
          feed=json.loads(Path(os.environ['TITLE_KO_FEED']).read_text(encoding='utf-8'))
          path=Path('data/title-translations.json')
          cache=json.loads(path.read_text(encoding='utf-8')).get('translations',{}) if path.exists() else {}
          count=len(pending(feed,cache))
          print('Untranslated English titles including backlog:',count)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('should_run='+('true' if count else 'false')+'\n')
          PY
      - name: Install CPU-only translation dependencies if needed
        if: steps.title_gate.outputs.should_run == 'true'
        run: |
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.40,<5' 'sentencepiece>=0.2,<1' 'sacremoses>=0.1,<1'
      - name: Translate English headlines to Korean with retry
        if: steps.title_gate.outputs.should_run == 'true'
        env:
          TITLE_KO_FEED: /tmp/nextbio-translation-candidates.json
          TITLE_KO_LIMIT: '60'
          TITLE_KO_BUDGET: '900'
          TITLE_KO_ATTEMPT_LOG: /tmp/nextbio-title-attempts.json
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/translate_news_titles.py
      - name: Save translated headlines for single-commit publication
        shell: bash
        run: |
          mkdir -p /tmp/nextbio-title-record
          if [ -f data/title-translations.json ]; then
            cp data/title-translations.json /tmp/nextbio-title-record/title-translations.json
          fi
      - name: Save headline attempt record for summary publication
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/nextbio-title-record
          if [ -f /tmp/nextbio-title-attempts.json ]; then
            cp /tmp/nextbio-title-attempts.json /tmp/nextbio-title-record/attempts.json
          else
            printf '{"attempted":[]}\n' > /tmp/nextbio-title-record/attempts.json
          fi
      - name: Upload headline attempt record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextbio-headline-attempts
          path: /tmp/nextbio-title-record/
          retention-days: 2
          if-no-files-found: error
  summaries:
    needs: titles
    if: ${{ needs.titles.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download unpublished feed for summary processing
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: nextbio-unpublished-news
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nextbio-staged
      - name: Use current feed for manual backfill
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p /tmp/nextbio-staged
          cp data/articles.json /tmp/nextbio-staged/articles.json
          if [ -f data/news_quality_audit.json ]; then cp data/news_quality_audit.json /tmp/nextbio-staged/news_quality_audit.json; fi
      - name: Download headline attempt record
        uses: actions/download-artifact@v4
        with:
          name: nextbio-headline-attempts
          path: /tmp/nextbio-title-record
      - name: Include latest translated headlines in summary processing
        run: |
          if [ -f /tmp/nextbio-title-record/title-translations.json ]; then
            python scripts/merge_title_cache.py data/title-translations.json /tmp/nextbio-title-record/title-translations.json
          fi
      - name: Prepare unpublished candidates for summary processing
        shell: bash
        run: |
          python scripts/publish_translated_news.py prepare /tmp/nextbio-staged/articles.json /tmp/nextbio-summary-candidates.json
          cp /tmp/nextbio-summary-candidates.json data/articles.json
      - name: Check whether article extraction is needed
        id: extract_gate
        run: python scripts/summary_work_gate.py extract
      - name: Install article extraction only if needed
        if: steps.extract_gate.outputs.should_run == 'true'
        run: pip install 'requests>=2.31,<3' 'trafilatura>=1.12,<3' 'googlenewsdecoder>=0.1.7,<1'
      - name: Extract new-first excerpts and rotate backlog
        if: steps.extract_gate.outputs.should_run == 'true'
        env:
          SUMMARY_MAX_NEW: '50'
          SUMMARY_TIME_BUDGET: '360'
        run: python scripts/build_article_summaries.py
      - name: Check whether Korean summary translation is needed
        id: translate_gate
        run: python scripts/summary_work_gate.py translate
      - name: Install CPU-only Korean summary translation dependencies
        if: steps.translate_gate.outputs.should_run == 'true'
        run: |
          python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.40,<5' 'sentencepiece>=0.2,<1' 'sacremoses>=0.1,<1'
      - name: Translate new and cached excerpts to Korean
        if: steps.translate_gate.outputs.should_run == 'true'
        env:
          SUMMARY_KO_LIMIT: '50'
          SUMMARY_KO_BUDGET: '1000'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/translate_article_summaries.py
      - name: Create recovery snapshot before publishing
        run: |
          python scripts/create_recovery_snapshot.py
          python scripts/verify_recovery_snapshot.py nextbio-recovery.tar.gz nextbio-recovery-manifest.json
      - name: Retain recovery snapshot for manual restoration
        uses: actions/upload-artifact@v4
        with:
          name: nextbio-recovery-${{ github.run_id }}
          path: |
            nextbio-recovery.tar.gz
            nextbio-recovery-manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish only articles with Korean titles and source-backed Korean summaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/article-summaries.json ]; then cp data/article-summaries.json /tmp/nextbio-summaries.json; fi
          if [ -f data/title-translations.json ]; then cp data/title-translations.json /tmp/nextbio-titles.json; fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ -f /tmp/nextbio-titles.json ]; then
              python scripts/merge_title_cache.py data/title-translations.json /tmp/nextbio-titles.json
            fi
            if [ -f /tmp/nextbio-summaries.json ]; then
              python scripts/merge_summary_cache.py data/article-summaries.json /tmp/nextbio-summaries.json
            fi
            python scripts/publish_translated_news.py /tmp/nextbio-staged/articles.json /tmp/nextbio-staged/news_quality_audit.json /tmp/nextbio-title-record/attempts.json
            python scripts/build_event_timelines.py
            python scripts/build_event_changes.py
            python scripts/build_cross_source_coverage.py
            python scripts/build_topic_monitor.py
            python scripts/build_daily_briefing.py
            python scripts/build_intelligence.py
            python scripts/build_evidence_index.py
            python scripts/build_geo_coverage.py
            python scripts/build_coverage_profiles.py
            python scripts/build_breaking_candidates.py
            python scripts/build_historical_index.py
            python scripts/build_weekly_report.py
            python scripts/build_country_coverage_trends.py
            python scripts/build_specialized_indexes.py
            python scripts/build_translation_quality.py
            python scripts/build_source_provenance.py
            python scripts/build_personalization_options.py
            python scripts/build_publication_gaps.py
            python scripts/build_collection_publication_audit.py /tmp/nextbio-staged/articles.json
            python scripts/build_pipeline_health.py
            python scripts/validate_news_data.py
            git add data/articles.json data/article-summaries.json data/pending-title-news.json data/title-translations.json data/event-timelines.json data/event-changes.json data/topic-monitor.json data/daily-briefing.json data/intelligence.json data/weekly-report.json data/evidence-index.json data/geo-coverage.json data/coverage-profiles.json data/breaking-candidates.json data/historical-index.json data/country-coverage-trends.json data/specialized-indexes.json data/pipeline-health.json data/translation-quality.json data/source-provenance.json data/personalization-options.json data/publication-gaps.json data/collection-publication-audit.json data/cross-source-coverage.json
            if [ -f data/news_quality_audit.json ]; then git add data/news_quality_audit.json; fi
            if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
            git commit -m 'Publish only fully summarized Korean news'
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
