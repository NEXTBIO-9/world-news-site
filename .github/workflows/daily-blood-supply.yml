name: Daily blood supply status
on:
  schedule:
    - cron: '35 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read Korean Red Cross public blood inventory
        run: python scripts/update_blood_supply.py
      - name: Commit updated public inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blood-supply.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public blood inventory snapshot"
            git push
          fi
