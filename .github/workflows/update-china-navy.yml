name: Update Chinese navy activity reports
on:
  schedule:
    - cron: '35 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nextbio-china-navy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect Chinese navy public reporting
        run: python scripts/update_china_navy.py
      - name: Publish updated report index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/china-navy-news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Chinese navy activity reports"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
