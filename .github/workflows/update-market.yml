
name: Update NEXT BIO market quotes

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install market data client
        run: python -m pip install 'yfinance>=0.2.54,<2'
      - name: Fetch market quotes
        run: python scripts/fetch_market.py
      - name: Commit updated quotes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Keep fetched quotes across retries while rebasing on the latest main.
          cp data/market.json /tmp/nextbio-market.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/nextbio-market.json data/market.json
            git add data/market.json
            if git diff --cached --quiet; then
              echo 'Market quotes unchanged'
              exit 0
            fi
            git commit -m 'Update market quotes'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; retrying ($attempt/5)"
            sleep 5
          done
          echo 'Could not publish market quotes after 5 attempts' >&2
          exit 1
