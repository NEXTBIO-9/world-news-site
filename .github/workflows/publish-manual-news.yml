name: Publish manual NEXT BIO news
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
concurrency:
  group: nextbio-manual-news-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.issue.user.login == 'NEXTBIO-9' && startsWith(github.event.issue.title, '[직접뉴스]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit published news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild against the latest remote state to avoid conflicting JSON commits.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_manual_news.py
            git add data/manual-articles.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish manual news issue #${{ github.event.issue.number }}"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
