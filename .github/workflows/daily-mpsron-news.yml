name: Daily Northeast Asia maritime prepositioning reports
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public official reporting
        run: python scripts/update_mpsron_news.py
      - name: Commit refreshed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mpsron-news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Northeast Asia MPS public reporting index"
            git push
          fi
