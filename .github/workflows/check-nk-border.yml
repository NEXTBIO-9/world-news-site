name: Check North Korea border construction daily
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nextbio-border-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check published reporting
        run: python scripts/check_nk_border.py
      - name: Commit only when the checked data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nk-border-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily North Korea border reporting check"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
