name: Test manual news publishing
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/publish_manual_news.py'
      - 'scripts/translate_article_summaries.py'
      - 'tests/test_summary_translation_validation.py'
      - 'scripts/fetch_news.py'
      - 'tests/test_news_fetch_concurrency.py'
      - 'scripts/merge_title_cache.py'
      - '.github/workflows/summarize-news.yml'
      - 'tests/test_title_cache_merge.py'
      - 'tests/test_manual_news.py'
      - '.github/workflows/test-manual-news.yml'
  pull_request:
    paths:
      - 'scripts/publish_manual_news.py'
      - 'scripts/translate_article_summaries.py'
      - 'tests/test_summary_translation_validation.py'
      - 'scripts/fetch_news.py'
      - 'tests/test_news_fetch_concurrency.py'
      - 'scripts/merge_title_cache.py'
      - '.github/workflows/summarize-news.yml'
      - 'tests/test_title_cache_merge.py'
      - 'tests/test_manual_news.py'
      - '.github/workflows/test-manual-news.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated publishing tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
