name: Security report validation
on:
  pull_request:
    paths:
      - 'scripts/generate_security_report.py'
      - 'tests/test_security_report.py'
      - '.github/workflows/security-report-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile scripts/generate_security_report.py
      - name: Validation unit tests
        run: python -m unittest discover -s tests -p 'test_security_report.py' -v
      - name: Read-only report eligibility test
        run: python scripts/generate_security_report.py --mode daily --dry-run
