name: Daily Northeast Asia GNSS notices
on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public GNSS notices
        run: python scripts/update_gnss_alerts.py
      - name: Commit public notice index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gnss-alerts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Northeast Asia GNSS notices"
            git push
          fi
