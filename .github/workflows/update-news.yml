name: Update news feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: world-news-feed-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect public RSS headlines
        run: |
          python scripts/fetch_news.py

      - name: Commit updated feed and quality audit
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data/articles.json /tmp/world-news-articles.json
          cp data/news_quality_audit.json /tmp/world-news-quality-audit.json

          for attempt in 1 2 3 4 5; do
            echo "Push attempt: $attempt"

            git fetch origin main
            git reset --hard origin/main

            cp /tmp/world-news-articles.json data/articles.json
            cp /tmp/world-news-quality-audit.json data/news_quality_audit.json
            git add data/articles.json data/news_quality_audit.json

            if git diff --cached --quiet; then
              echo "No news changes to commit."
              exit 0
            fi

            git commit -m "Update news feed and quality audit"

            if git push origin HEAD:main; then
              echo "News feed and quality audit updated successfully."
              exit 0
            fi

            echo "Push conflict; retrying..."
            sleep 5
          done

          echo "Failed to push news feed after 5 attempts."
          exit 1
