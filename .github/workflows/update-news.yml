name: Update news feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: nextbio-news-pipeline
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect public RSS headlines (not yet published)
        run: python scripts/fetch_news.py
      - name: Stage unpublished news and audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path('data/articles.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('data/news_quality_audit.json').read_text(encoding='utf-8'))
          if not isinstance(feed, dict) or not isinstance(feed.get('articles'), list):
              raise SystemExit('Collection output must contain an articles list')
          if not isinstance(audit, dict):
              raise SystemExit('Collection audit must be a JSON object')
          print('Collected articles:', len(feed['articles']))
          PY
          mkdir -p /tmp/nextbio-staged
          cp data/articles.json /tmp/nextbio-staged/articles.json
          cp data/news_quality_audit.json /tmp/nextbio-staged/news_quality_audit.json
      - name: Upload unpublished news for translation
        uses: actions/upload-artifact@v4
        with:
          name: nextbio-unpublished-news
          path: /tmp/nextbio-staged/
          retention-days: 2
          if-no-files-found: error
