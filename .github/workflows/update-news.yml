name: Update news feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: world-news-feed-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect public RSS headlines
        run: |
          python scripts/fetch_news.py

      - name: Commit updated feed and quality audit
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp data/articles.json /tmp/world-news-articles.json
          cp data/news_quality_audit.json /tmp/world-news-quality-audit.json

          for attempt in 1 2 3 4 5; do
            echo "Push attempt: $attempt"

            git fetch origin main
            git reset --hard origin/main

            # Preserve existing Korean translations for unchanged articles.
            python - <<'PY'
          import json
          from pathlib import Path

          current_path = Path('data/articles.json')
          fresh_path = Path('/tmp/world-news-articles.json')
          current = json.loads(current_path.read_text(encoding='utf-8')) if current_path.exists() else {}
          fresh = json.loads(fresh_path.read_text(encoding='utf-8'))
          by_identity = {
              (a.get('url'), a.get('title')): a
              for a in current.get('articles', []) if isinstance(a, dict)
          }
          for article in fresh.get('articles', []):
              if not isinstance(article, dict):
                  continue
              old = by_identity.get((article.get('url'), article.get('title')))
              if not old:
                  continue
              if old.get('title_ko'):
                  article['title_ko'] = old['title_ko']
                  if old.get('translation_quality_version'):
                      article['translation_quality_version'] = old['translation_quality_version']
              elif old.get('translation_failed_version'):
                  article['translation_failed_version'] = old['translation_failed_version']
          current_path.write_text(json.dumps(fresh, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            cp /tmp/world-news-quality-audit.json data/news_quality_audit.json
            git add data/articles.json data/news_quality_audit.json

            if git diff --cached --quiet; then
              echo "No news changes to commit."
              exit 0
            fi

            git commit -m "Update news feed and quality audit"

            if git push origin HEAD:main; then
              echo "News feed and quality audit updated successfully."
              exit 0
            fi

            echo "Push conflict; retrying..."
            sleep 5
          done

          echo "Failed to push news feed after 5 attempts."
          exit 1
